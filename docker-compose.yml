services:
  mysql:
    image: mysql:8.4
    container_name: aggri-ai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "ChangeMe_123!"
      MYSQL_DATABASE: "aggri_ai"
      MYSQL_USER: "aggri_ai"
      MYSQL_PASSWORD: "ChangeMe_123!"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pChangeMe_123!"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
